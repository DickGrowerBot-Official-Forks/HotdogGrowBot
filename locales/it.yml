commands:
  help:
    description: "Ti aiuterò, mio amico"
  privacy:
    description: "Informativa sulla privacy che descrive quali dati memorizziamo"
  grow:
    description: "Fai crescere il tuo hot dog!"
    result: "Il tuo hot dog è %{event} di <b>%{incr}″</b> e ora è lungo <b>%{length}″</b>."
    direction:
      grown: "cresciuto"
      shrunk: "rimpicciolito"
    position: "La tua posizione nella classifica è <b>%{pos}</b>."
    tomorrow: "Hai già giocato con il tuo hot dog oggi."
  top:
    description: "Mostra gli hot dog più grandi del gruppo"
    title: "Classifica degli hot dog più grandi:"
    line: "%{n}|<b>%{name}</b> — <b>%{length}″</b>"
    ending: "<i>[+] significa che un giocatore non ha ancora fatto crescere il suo hot dog oggi.</i>"
    ending_inactive: "<i>[~] significa che un giocatore non ha fatto crescere il suo hot dog per più di %{days} giorni.</i>"
    empty: "Nessuno sta giocando :("
  dod:
    description: "Eleggi l'Hot dog del Giorno"
    result: "L'Hot dog del Giorno è <b><a href=\"tg://user?id=%{uid}\">%{name}</a></b>!\n\nIl suo hot dog è cresciuto di <b>%{growth}″</b> e ora è lungo <b>%{length}″</b>."
    position: "La sua posizione nella classifica è <b>%{pos}</b>."
    already_chosen: "L'Hot dog del Giorno è già stato scelto oggi! Si tratta di <b>%{name}</b>."
    no_candidates: "Non ci sono candidati per l'elezione, in questo gruppo non gioca nessuno 😢"
  pvp:
    description: "Combatti con l'hot dog del tuo amico!"
    results:
      start: "<b>%{name}</b> ha sfidato il gruppo con una scommessa di <b>%{bet}″</b>!"
      finish: "Il vincitore è <b>%{winner_name}</b>! Il suo hot dog ora è lungo <b>%{winner_length}″</b>. Quello del giocatore perdente è ora di <b>%{loser_length}″</b>.\nLa scommessa era di <b>%{bet}″</b>."
      position:
        winner: "La posizione nella classifica di <b>%{name}</b> è <b>%{pos}</b>."
        loser: "La posizione nella classifica di <b>%{name}</b> è <b>%{pos}</b>."
      stats:
        text: "Tasso di vittoria del <b>vincitore</b> — <b>%{winner_win_rate}</b>.\nLa sua serie di vittorie attuale — <b>%{winner_win_streak}</b>, serie di vittorie massima — <b>%{winner_win_streak_max}</b>.\nTasso di vittoria del <b>perdente</b> — <b>%{loser_win_rate}</b>."
        lost_win_streak: "La serie di <b>%{lost_win_streak}</b> vittorie di fila è stata persa."
    button: "Attacca!"
    errors:
      no_args: "Chiama il comando con un numero di pollici che sei disposto a scommettere."
      not_enough:
        initiator: "Meh. L'hot dog dello sfidante non è lungo abbastanza per una tale scommessa!"
        acceptor: "Il tuo hot dog non è abbastanza lungo 😣"
      same_person: "Non puoi sfidarti da solo!"
      battle_already_in_progress: "La battaglia è già in corso! Il messaggio verrà aggiornato in un momento…"
  stats:
    description: "Statistiche"
    length: "Lunghezza: <b>%{length}″</b>\nPosizione in classifica: <b>%{pos}</b>"
    pvp: "Tasso di vittoria: <b>%{win_rate}</b>.\nSfide: <b>%{battles}</b>.\nVittorie: <b>%{wins}</b>.\nSerie di vittorie massima: <b>%{win_streak}</b>.\nLunghezza acquisita: <b>%{acquired}″</b>.\nLunghezza persa: <b>%{lost}″</b>."
    personal: "<i>Le tue statistiche personali:</i>\n— Numero di gruppi in cui giochi: <b>%{chats}</b>.\n— Lunghezza massima raggiunta: <b>%{max_length}″</b>.\n— Somma dei tuoi hot dog in tutti i gruppi: <b>%{total_length}″</b>."
  reset:
    description: "Azzera tutte le lunghezze della chat"
    warning: "Questa operazione azzera tutte le lunghezze degli hot dog nella chat e reimposta i tentativi odierni di /grow e /dod. Le statistiche delle sfide e i vincitori dei giorni precedenti resteranno. Continuare?"
    buttons:
      confirm: "Azzera lunghezze"
      cancel: "Annulla"
    success: "Tutte le lunghezze degli hot dog in questa chat sono state azzerate."
    cancelled: "Azzeramento annullato."
    errors:
      owner_only: "Solo il proprietario della chat può azzerarne i progressi."
inline:
  results:
    text: "Clicca il tasto qui sotto per avere il risultato!"
    button: "Cliccami!"
    titles:
      grow: "Fai crescere il tuo hot dog!"
      top: "Mostra gli hot dog più grandi del gruppo"
      dick_of_day: "Eleggi l'Hot dog del Giorno"
      pvp: "Sfida gli altri con una scommessa di %{bet}″!"
      stats: "Statistiche"
  callback:
    errors:
      another_user: "Questo messaggio è stato inviato da un'altra persona."
      invalid_data: "Questo messaggio potrebbe essere stato mandato da una vecchia versione del bot. Prova a rimandarlo."
      unknown_data: "Comando sconosciuto"
      no_data: "Qualcosa è andato storto…"
titles:
  greeting: "Ciao"
  time_till_next_day:
    none: " Torna domani!"
    some: "\n\nProssimo tentativo tra <b>%{hours}</b>h <b>%{minutes}</b>m."
errors:
  not_group_chat: "Questo bot può svolgere la sua missione solo nei gruppi!"
  group_account: "Non puoi giocare per conto di un gruppo o canale — disattiva la modalità anonima e riprova!"
