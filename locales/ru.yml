commands:
  help:
    description: "Я обязательно помогу тебе, друг"
  privacy:
    description: "политика по работе с персональными данными"
  grow:
    description: "Вырасти хот-дог!"
    result: "Твоя сосиска %{event} на <b>%{incr}″</b> и теперь её длина составляет <b>%{length}″</b>."
    direction:
      grown: "выросла"
      shrunk: "скукожилась"
    position: "Ты занимаешь <b>%{pos}</b> место в топе."
    tomorrow: "Ты уже играл с сосиской сегодня."
  top:
    description: "Узнай рейтинг самых больших хот-догов в чате"
    title: "Топ самых больших хот-догов:"
    line: "%{n}|<b>%{name}</b> — <b>%{length}″</b>"
    ending: "<i>[+] значит, что гровер не растил ещё свою сосиску сегодня.</i>"
    ending_inactive: "<i>[~] значит, что гровер не растил свою сосиску более %{days} дней.</i>"
    empty: "Никто пока не участвует в игре :("
  dod:
    description: "Выбор Хот-дога дня"
    result: "Пам-пам-пам! Хот-дог дня — <b><a href=\"tg://user?id=%{uid}\">%{name}</a></b>!\n\nЕго хот-дог вырос на <b>%{growth}″</b> и теперь длиной <b>%{length}″</b>."
    position: "Он занимает <b>%{pos}</b> место в топе."
    already_chosen: "Хот-дог дня уже был выбран на сегодня! Это <b>%{name}</b>."
    no_candidates: "Не из кого выбирать: в этом чате ещё никто не участвует в игре 😢"
  pvp:
    description: "Сражайся с хот-догами друзей!"
    results:
      start: "<b>%{name}</b> бросил чату вызов со ставкой <b>%{bet}″</b>!"
      finish: "Победитель — <b>%{winner_name}</b>! Его хот-дог теперь равен <b>%{winner_length}″</b>, а проигравшего — <b>%{loser_length}″</b>.\nСтавка была <b>%{bet}″</b>."
      position:
        winner: "<b>%{name}</b> занимает <b>%{pos}</b> место в топе."
        loser: "<b>%{name}</b> занимает <b>%{pos}</b> место в топе."
      stats:
        text: "Процент выигрышей <b>победителя</b> — <b>%{winner_win_rate}</b>.\nЕго текущая серия побед — <b>%{winner_win_streak}</b>, максимальная — <b>%{winner_win_streak_max}</b>.\nПроцент выигрышей <b>проигравшего</b> — <b>%{loser_win_rate}</b>."
        lost_win_streak: "Прервалась серия из <b>%{lost_win_streak}</b> побед подряд."
    button: "Атаковать!"
    errors:
      no_args: "Вызови команду с числом дюймов, которые готов поставить."
      not_enough:
        initiator: "Пфф. Хот-дог инициатора слишком короткий для такой ставки!"
        acceptor: "Твоя хот-догова слишком коротка 😣"
      same_person: "Нельзя биться с самим собой!"
      battle_already_in_progress: "Сражение уже началось! Сообщение обновится через мгновение…"
  stats:
    description: "Статистика"
    length: "Длина: <b>%{length}″</b>\nПозиция в топе: <b>%{pos}</b>"
    pvp: "Процент выигрышей: <b>%{win_rate}</b>.\nСыгранных боёв: <b>%{battles}</b>.\nПобед: <b>%{wins}</b>.\nМаксимум побед подряд: <b>%{win_streak}</b>.\nВыиграно: <b>%{acquired}″</b>.\nПроиграно: <b>%{lost}″</b>."
    personal: "<i>Персональная статистика:</i>\n— Количество чатов: <b>%{chats}</b>.\n— Максимальная длина: <b>%{max_length}″</b>.\n— Суммарная длина хот-догов среди всех чатов: <b>%{total_length}″</b>."
  reset:
    description: "Сбросить длину всех хот-догов в чате"
    warning: "Все длины хот-догов в этом чате будут удалены безвозвратно. Победители дня и статистика битв сохранятся, а все участники смогут сразу снова использовать /grow. Продолжить?"
    buttons:
      confirm: "Сбросить длины"
      cancel: "Отмена"
    success: "Все длины хот-догов в этом чате сброшены."
    cancelled: "Сброс отменён."
    errors:
      owner_only: "Сбросить прогресс может только владелец чата."
inline:
  results:
    text: "Так как я не могу определить чат из inline-запроса, нажми на кнопку ниже, чтобы получить результат."
    button: "Кликни!"
    titles:
      grow: "Увеличь свою хот-дог!"
      top: "Топ самых огромных хот-догов"
      dick_of_day: "Избрание Хот-дога дня"
      pvp: "Брось вызов другим гроверам со ставкой %{bet}″!"
      stats: "Статистика побед"
  callback:
    errors:
      another_user: "Сообщение было отправлено другим человеком."
      invalid_data: "Возможно, это сообщение было отправлено через более старую версию бота. Попробуй послать его ещё раз."
      unknown_data: "Неизвестная команда"
      no_data: "Что-то пошло не так нет…"
titles:
  greeting: "Приветствую"
  time_till_next_day:
    none: " Возвращайся завтра!"
    some: "\n\nСледующая попытка через <b>%{hours}</b> ч. <b>%{minutes}</b> мин."
errors:
  not_group_chat: "Бот выполняет свою миссию только в групповых чатах!"
  group_account: "Нельзя играть от имени группы или канала — отключите анонимный режим и попробуйте снова!"
