commands:
  help:
    description: "有什么问题吗"
  privacy:
    description: "存储数据说明详见隐私政策，"
  grow:
    description: "让你的热狗变大！"
    result: "你的热狗已经<b>%{incr}″</b> %{event}，现在长度为<b>%{length}″</b>。"
    direction:
      grown: "增长了"
      shrunk: "缩短了"
    position: "你在排行榜上的位置是<b>%{pos}</b>。"
    tomorrow: "你今天已经玩过你的热狗了。"
  top:
    description: "获取聊天中最大的热狗"
    title: "最大的热狗排行榜："
    line: "%{n}|<b>%{name}</b> — <b>%{length}″</b>"
    ending: "<i>[+] 表示一个玩家今天还没有增长他的热狗。</i>"
    ending_inactive: "<i>[~] 表示一个玩家超过 %{days} 天没有增长他的热狗了。</i>"
    empty: "还没有人加入游戏 :("
  dod:
    description: "选举今日热狗"
    result: "今日热狗是<b><a href=\"tg://user?id=%{uid}\">%{name}</a></b>！\n\n他的热狗增长了<b>%{growth}″</b>，现在长度为<b>%{length}″</b>。"
    position: "他在排行榜上的位置是<b>%{pos}</b>。"
    already_chosen: "今日热狗已经被选出来了！是<b>%{name}</b>。"
    no_candidates: "没有候选人可以选举。在这个聊天中还没有人加入游戏 😢"
  pvp:
    description: "斗鸡！"
    results:
      start: "<b>%{name}</b> 向聊天发起了一个<b>%{bet}″</b>的挑战！"
      finish: "胜利者是<b>%{winner_name}</b>！他的热狗现在长度为<b>%{winner_length}″</b>。失败者的热狗长度为<b>%{loser_length}″</b>。\n赌注是<b>%{bet}″</b>。"
      position:
        winner: "<b>%{name}</b> 在排行榜上的位置是<b>%{pos}</b>。"
        loser: "<b>%{name}</b> 在排行榜上的位置是<b>%{pos}</b>。"
      stats:
        text: "<b>胜利者</b>的胜率 — <b>%{winner_win_rate}</b>。\n他当前的连胜 — <b>%{winner_win_streak}</b>，最大连胜 — <b>%{winner_win_streak_max}</b>。\n<b>失败者</b>的胜率 — <b>%{loser_win_rate}</b>。"
        lost_win_streak: "<b>%{lost_win_streak}</b> 连胜被终结了。"
    button: "斗鸡！"
    errors:
      no_args: "发起挑战时请填写以英寸为单位的赌注。"
      not_enough:
        initiator: "呃。发起者的热狗不够长，无法下这么大的赌注！"
        acceptor: "你的枪不够长 😣"
      same_person: "你不能和自己斗鸡！"
      battle_already_in_progress: "已经在斗鸡！结果立等可取"
  stats:
    description: "统计"
    length: "长度: <b>%{length}″</b>\n在排行榜上的位置: <b>%{pos}</b>"
    pvp: "胜率: <b>%{win_rate}</b>。\n战斗次数: <b>%{battles}</b>。\n胜利次数: <b>%{wins}</b>。\n最大连胜: <b>%{win_streak}</b>。\n获得长度: <b>%{acquired}″</b>。\n失去长度: <b>%{lost}″</b>。"
    personal: "<i>你的个人统计:</i>\n— 你参与的游戏聊天数量: <b>%{chats}</b>。\n— 最大长度: <b>%{max_length}″</b>。\n— 所有聊天中的热狗总长度: <b>%{total_length}″</b>。"
  reset:
    description: "重置本群所有热狗长度"
    warning: "这将永久删除本群所有玩家的热狗长度。每日获胜记录和对战统计会保留，所有人都可以立即再次使用 /grow。是否继续？"
    buttons:
      confirm: "重置长度"
      cancel: "取消"
    success: "本群所有热狗长度已重置。"
    cancelled: "已取消重置。"
    errors:
      owner_only: "只有群主可以重置本群进度。"
inline:
  results:
    text: "由于我无法通过内联查询确定聊天，你应该点击下面的按钮以获取结果。"
    button: "点我！"
    titles:
      grow: "让你的热狗变大！"
      top: "获取聊天中最大的热狗"
      dick_of_day: "选举今日热狗"
      pvp: "用 %{bet}″的赌注挑战其他人！"
      stats: "胜利统计"
  callback:
    errors:
      another_user: "此消息由其他人发送。"
      invalid_data: "可能此消息是通过旧版本的机器人发送的。请尝试重新发送。"
      unknown_data: "未知命令"
      no_data: "出了点问题…"
titles:
  greeting: "你好"
  time_till_next_day:
    none: " 回去玩热狗，明天再来！"
    some: "\n\n下次尝试在 <b>%{hours}</b>小时 <b>%{minutes}</b>分钟后。"
errors:
  not_group_chat: "此机器人仅在群聊中执行任务！"
  group_account: "不能以群组或频道的身份游玩——请关闭匿名模式后重试！"
