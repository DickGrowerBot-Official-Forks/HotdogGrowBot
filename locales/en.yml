commands:
  help:
    description: "I'll help you, my friend"
  privacy:
    description: "Privacy Policy detailing what data we store"
  grow:
    description: "Grow your hotdog!"
    result: "Your hotdog has %{event} by <b>%{incr}″</b> and now it is <b>%{length}″</b> long."
    direction:
      grown: "grown"
      shrunk: "shrunk"
    position: "Your position in the top is <b>%{pos}</b>."
    tomorrow: "You have already played with your hotdog today."
  top:
    description: "Get the biggest hotdogs of the chat"
    title: "Top of the biggest hotdogs:"
    line: "%{n}|<b>%{name}</b> — <b>%{length}″</b>"
    ending: "<i>[+] means a grower hasn't grown his hotdog today yet.</i>"
    ending_inactive: "<i>[~] means a grower hasn't grown his hotdog for more than %{days} days.</i>"
    empty: "No one is in the game yet :("
  dod:
    description: "Elect the Hotdog of the Day"
    result: "The Hotdog of the Day is <b><a href=\"tg://user?id=%{uid}\">%{name}</a></b>!\n\nHis hotdog has become longer for <b>%{growth}″</b> and is <b>%{length}″</b> long now."
    position: "His position in the top is <b>%{pos}</b>."
    already_chosen: "The Hotdog of the Day has been already chosen for today! It's <b>%{name}</b>."
    no_candidates: "There is no candidates for election. In this chat nobody is in the game yet 😢"
  pvp:
    description: "Fight with your friend's hotdog!"
    results:
      start: "<b>%{name}</b> challenged the chat with a bet of <b>%{bet}″</b>!"
      finish: "The winner is <b>%{winner_name}</b>! His hotdog is now <b>%{winner_length}″</b> long. The loser's hotdog is <b>%{loser_length}″</b>.\nThe bet was <b>%{bet}″</b>."
      position:
        winner: "<b>%{name}</b>'s position in the top is <b>%{pos}</b>."
        loser: "<b>%{name}</b>'s position in the top is <b>%{pos}</b>."
      stats:
        text: "Win rate of the <b>winner</b> — <b>%{winner_win_rate}</b>.\nHis current win streak — <b>%{winner_win_streak}</b>, max win streak — <b>%{winner_win_streak_max}</b>.\nWin rate of the <b>loser</b> — <b>%{loser_win_rate}</b>."
        lost_win_streak: "The streak of <b>%{lost_win_streak}</b> victories in a row was lost."
    button: "Attack!"
    errors:
      no_args: "Call the command with a number of inches you're willing to bet."
      not_enough:
        initiator: "Meh. The initiator's hotdog is not long enough for such a big bet!"
        acceptor: "Your hotdog is not long enough 😣"
      same_person: "You cannot fight with yourself!"
      battle_already_in_progress: "The fight is in progress already! The message will be updated in a moment…"
  stats:
    description: "Statistics"
    length: "Length: <b>%{length}″</b>\nPosition in the top: <b>%{pos}</b>"
    pvp: "Win rate: <b>%{win_rate}</b>.\nFights: <b>%{battles}</b>.\nWins: <b>%{wins}</b>.\nMax win streak: <b>%{win_streak}</b>.\nAcquired length: <b>%{acquired}″</b>.\nLost length: <b>%{lost}″</b>."
    personal: "<i>Your personal statistics:</i>\n— Number of the chats in which you play: <b>%{chats}</b>.\n— Maximum length: <b>%{max_length}″</b>.\n— Sum of hotdogs across all the chats: <b>%{total_length}″</b>."
  reset:
    description: "Reset every hotdog length in this chat"
    warning: "Every hotdog length in this chat will be set to zero. Today's /grow and /dod attempts will be reset; battle statistics and previous daily winners will be kept. Continue?"
    buttons:
      confirm: "Reset lengths"
      cancel: "Cancel"
    success: "All hotdog lengths in this chat have been reset."
    cancelled: "Reset cancelled."
    errors:
      owner_only: "Only the chat owner can reset its progress."
inline:
  results:
    text: "Since I cannot determine the chat by an inline query, you should click on the button below to get the result."
    button: "Click me!"
    titles:
      grow: "Grow your hotdog!"
      top: "Get the biggest hotdogs of the chat"
      dick_of_day: "Elect the Hotdog of the Day"
      pvp: "Challenge others with a bet of %{bet}″!"
      stats: "Win statistics"
  callback:
    errors:
      another_user: "This message was sent by another person."
      invalid_data: "Possibly this message was sent via an older version of the bot. Try to resend it again."
      unknown_data: "Unknown command"
      no_data: "Something went wrong…"
titles:
  greeting: "Hello"
  time_till_next_day:
    none: " Come back tomorrow!"
    some: "\n\nNext attempt in <b>%{hours}</b>h <b>%{minutes}</b>m."
errors:
  not_group_chat: "This bot is supposed to do its mission in group chats only!"
  group_account: "You can't play on behalf of a group or channel — switch off anonymous mode and try again!"
