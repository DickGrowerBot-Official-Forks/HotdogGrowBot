commands:
  grow:
    result: "你的熱狗已經<b>%{incr}″</b> %{event}，現在長度為<b>%{length}″</b>。"
    direction:
      grown: "增長了"
      shrunk: "縮短了"
    position: "你在排行榜上的位置是<b>%{pos}</b>。"
    tomorrow: "你今天已經玩過你的熱狗了。"
  top:
    title: "最大的熱狗排行榜："
    line: "%{n}|<b>%{name}</b> — <b>%{length}″</b>"
    ending: "<i>[+] 表示一個成長者今天還沒有增長他的熱狗。</i>"
    ending_inactive: "<i>[~] 表示一個成長者超過 %{days} 天沒有增長他的熱狗了。</i>"
    empty: "還沒有人加入遊戲 :("
  dod:
    result: "今日熱狗是<b><a href=\"tg://user?id=%{uid}\">%{name}</a></b>！\n\n他的熱狗增長了<b>%{growth}″</b>，現在長度為<b>%{length}″</b>。"
    position: "他在排行榜上的位置是<b>%{pos}</b>。"
    already_chosen: "今日熱狗已經被選出來了！是<b>%{name}</b>。"
    no_candidates: "沒有候選人可以選舉。在這個聊天中還沒有人加入遊戲 😢"
  pvp:
    results:
      start: "<b>%{name}</b> 向聊天發起了一個<b>%{bet}″</b>的挑戰！"
      finish: "勝利者是<b>%{winner_name}</b>！他的熱狗現在長度為<b>%{winner_length}″</b>。失敗者的熱狗長度為<b>%{loser_length}″</b>。\n賭注是<b>%{bet}″</b>。"
      position:
        winner: "<b>%{name}</b> 在排行榜上的位置是<b>%{pos}</b>。"
        loser: "<b>%{name}</b> 在排行榜上的位置是<b>%{pos}</b>。"
      stats:
        text: "<b>勝利者</b>的勝率 — <b>%{winner_win_rate}</b>。\n他當前的連勝 — <b>%{winner_win_streak}</b>，最大連勝 — <b>%{winner_win_streak_max}</b>。\n<b>失敗者</b>的勝率 — <b>%{loser_win_rate}</b>。"
        lost_win_streak: "<b>%{lost_win_streak}</b> 連勝被終結了。"
    button: "PK！"
    errors:
      no_args: "發起PK要下注。"
      not_enough:
        initiator: "呃。發起者的熱狗不夠長，無法下這麼大的賭注！"
        acceptor: "你的熱狗不夠長 😣"
      same_person: "你不能和自己PK！"
      battle_already_in_progress: "已經在對戰了！結果稍後就會更新……"
  stats:
    length: "長度: <b>%{length}″</b>\n在排行榜上的位置: <b>%{pos}</b>"
    pvp: "勝率: <b>%{win_rate}</b>。\n戰鬥次數: <b>%{battles}</b>。\n勝利次數: <b>%{wins}</b>。\n最大連勝: <b>%{win_streak}</b>。\n獲得長度: <b>%{acquired}″</b>。\n失去長度: <b>%{lost}″</b>。"
    notice: "統計收集從2024年7月2日開始。"
    personal: "<i>你的個人統計:</i>\n— 你參與的遊戲聊天數量: <b>%{chats}</b>。\n— 最大長度: <b>%{max_length}″</b>。\n— 所有聊天中的熱狗總長度: <b>%{total_length}″</b>。"
  reset:
    description: "重設本群所有熱狗長度"
    warning: "這將永久刪除本群所有玩家的熱狗長度。每日獲勝記錄和對戰統計會保留，所有人都可以立即再次使用 /grow。是否繼續？"
    buttons:
      confirm: "重設長度"
      cancel: "取消"
    success: "本群所有熱狗長度已重設。"
    cancelled: "已取消重設。"
    errors:
      owner_only: "只有群主可以重設本群進度。"
inline:
  results:
    text: "由於我無法透過內聯查詢確定聊天，你應該點擊下面的按鈕以取得結果。"
    button: "點我！"
    titles:
      grow: "讓你的熱狗變大！"
      top: "取得聊天中最大的熱狗"
      dick_of_day: "選出今日熱狗"
      pvp: "用 %{bet}″的賭注挑戰其他人！"
      stats: "勝利統計"
  callback:
    errors:
      another_user: "此訊息由其他人發送。"
      invalid_data: "可能此訊息是透過舊版本的機器人發送的。請嘗試重新發送。"
      unknown_data: "未知命令"
      no_data: "出了點問題…"
titles:
  greeting: "你好"
  time_till_next_day:
    none: " 回去玩熱狗，明天再來！"
    some: "\n\n下次嘗試在 <b>%{hours}</b>小時 <b>%{minutes}</b>分鐘後。"
errors:
  not_group_chat: "此機器人僅在群聊中執行任務！"
  group_account: "不能以群組或頻道的身份遊玩——請關閉匿名模式後重試！"
  feature_disabled: "此功能當前暫時禁用。"
