    description: "آمار"
    length: "طول: <b>%{length}″</b>\nرتبه در جدول: <b>%{pos}</b>"
    pvp: "نرخ برد: <b>%{win_rate}</b>.\nمبارزات: <b>%{battles}</b>.\nبردها: <b>%{wins}</b>.\nبیشترین سری برد: <b>%{win_streak}</b>.\nطول به‌دست‌آمده: <b>%{acquired}″</b>.\nطول از دست رفته: <b>%{lost}″</b>."
    notice: "جمع‌آوری آمار از 2 جولای 2024 شروع شده."
    personal: "<i>آمار شخصی شما:</i>\n— تعداد چت‌هایی که توش بازی می‌کنی: <b>%{chats}</b>.\n— بیشترین طول: <b>%{max_length}″</b>.\n— مجموع طول هات‌داگ‌ها در تمام چت‌ها: <b>%{total_length}″</b>."
  reset:
    description: "بازنشانی طول همهٔ هات‌داگ‌های گروه"
    warning: "این کار طول هات‌داگ همهٔ بازیکنان این گروه را برای همیشه حذف می‌کند. برندگان روزانه و آمار رقابت‌ها باقی می‌مانند و همه می‌توانند بلافاصله دوباره /grow را اجرا کنند. ادامه می‌دهی؟"
    buttons:
