Hotdog Grow 保存用户 ID 和姓名，用于排行榜与对战结果。注册日期用于新玩家的免缩短期。群聊 ID 用于区分各群聊的游戏数据。

机器人保存以英寸计量的热狗长度、最后增长日期、对战统计和每日竞赛获胜者。不保存完整对战日志。

数据库结构见<a href="https://github.com/DickGrowerBot-Official-Forks/HotdogGrowBot/tree/main/migrations">源代码仓库</a>。

上述数据不会提供给第三方机构，以下情况除外：
    ➖ 俄罗斯托管公司 <a href="https://timeweb.cloud">TimeWeb</a>，提供运行机器人所需的云基础设施；
    ➖ 法国托管公司 <a href="https://www.scaleway.com/en/">Scaleway</a>，提供兼容 S3 的存储服务用于保存数据库备份。
